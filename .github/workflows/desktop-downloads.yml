name: Build DMG and AppImage
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or commit to package
        required: true
        default: v1.1.0
      upload_to_release:
        description: Upload verified files to the existing release for this tag
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            asset: macOS
          - os: ubuntu-22.04
            asset: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Package and test Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfuse2 xvfb libgtk-3-0 libnss3 libasound2
          npx --no-install electron-builder --linux AppImage --x64 --publish never -c.toolsets.appimage=1.0.3 '-c.linux.category=Education' '-c.linux.artifactName=MathCards-${version}-linux-x86_64.${ext}'
          image=(release/*.AppImage)
          xvfb-run -a node scripts/smoke-packaged.mjs "${image[0]}"
      - name: Package and test universal macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npx --no-install electron-builder --mac dmg --universal --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false '-c.mac.artifactName=MathCards-${version}-mac-universal.${ext}'
          image=(release/*.dmg)
          hdiutil verify "${image[0]}"
          mount_dir="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "${image[0]}"
          trap 'hdiutil detach "$mount_dir"' EXIT
          app="$mount_dir/MathCards.app"
          lipo "$app/Contents/MacOS/MathCards" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"
          node scripts/smoke-packaged.mjs "$app/Contents/MacOS/MathCards"
      - uses: actions/upload-artifact@v4
        with:
          name: MathCards-${{ matrix.asset }}
          path: |
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  publish:
    needs: package
    if: inputs.upload_to_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MathCards-*
          merge-multiple: true
          path: packages
      - name: Attach verified installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.ref }}
        run: gh release upload "$RELEASE_TAG" packages/*.dmg packages/*.AppImage --repo "$GITHUB_REPOSITORY"
