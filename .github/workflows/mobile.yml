name: Mobile builds
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run mobile:sync
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: MathCards-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run mobile:sync
      - name: Build iPhone device archive
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/MathCards.xcarchive" CODE_SIGNING_ALLOWED=NO archive
      - name: Package archive
        run: ditto -c -k --keepParent "$RUNNER_TEMP/MathCards.xcarchive" MathCards-iOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MathCards-iOS-unsigned
          path: MathCards-iOS.zip
          if-no-files-found: error
