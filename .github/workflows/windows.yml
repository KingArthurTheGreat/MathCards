name: Windows installer
on:
  workflow_dispatch:
    inputs:
      signed:
        description: 'Подписать сертификатом из WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD Secrets'
        type: boolean
        default: false
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency security audit
        run: npm audit
      - name: TypeScript strict
        run: npm run typecheck
      - name: Database, selection and backup tests
        run: npm test
      - name: Build frontend and Electron
        run: npm run build
      - name: Electron acceptance test
        run: node scripts/e2e.mjs
      - name: Package unsigned NSIS and portable (x64)
        if: ${{ !inputs.signed }}
        run: node scripts/build-windows.mjs
      - name: Package signed NSIS and portable (x64)
        if: ${{ inputs.signed }}
        run: node scripts/build-windows.mjs --signed
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Verify Authenticode signatures
        if: ${{ inputs.signed }}
        shell: pwsh
        run: |
          $files = @('release/win-unpacked/MathCards.exe') + @(Get-ChildItem release/MathCards-*.exe | ForEach-Object FullName)
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $file" }
          }
      - name: Smoke test packaged Windows app
        run: node scripts/smoke-packaged.mjs release/win-unpacked/MathCards.exe
      - name: Smoke test installed Windows app
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/MathCards-Setup-*.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'MathCardsInstalled'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          node scripts/smoke-packaged.mjs "$installDir/MathCards.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed application smoke test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: MathCards-Windows-x64-${{ inputs.signed && 'signed' || 'unsigned' }}
          path: |
            release/MathCards-Setup-*.exe
            release/MathCards-Portable-*.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-windows
          path: test-results/
          if-no-files-found: ignore
